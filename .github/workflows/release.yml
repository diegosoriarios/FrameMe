name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" \
            || sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FRAMEME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing FRAMEME_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        id: build
        env:
          FRAMEME_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          FRAMEME_KEYSTORE_PASSWORD: ${{ secrets.FRAMEME_KEYSTORE_PASSWORD }}
          FRAMEME_KEY_ALIAS: ${{ secrets.FRAMEME_KEY_ALIAS }}
          FRAMEME_KEY_PASSWORD: ${{ secrets.FRAMEME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION_NAME="${RELEASE_TAG#v}"
          echo "Building version $VERSION_NAME (code $GITHUB_RUN_NUMBER) for tag $RELEASE_TAG"
          ./gradlew :app:assembleRelease \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="$VERSION_NAME" \
            --no-configuration-cache

          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"

          OUT="FrameMe-${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameMe-${{ env.RELEASE_TAG }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FrameMe ${{ env.RELEASE_TAG }}
          files: ${{ steps.build.outputs.apk }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
